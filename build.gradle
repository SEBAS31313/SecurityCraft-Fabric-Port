plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.16'
    id 'java-library'
}
version = project.mod_version
group = 'net.geforcemods.securitycraft'
base.archivesName = 'securitycraft-fabric'
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
loom {
    accessWidenerPath = file('src/main/resources/securitycraft.accesswidener')
    runs {
        client { client(); runDir 'run/client' }
        server { server(); runDir 'run/server'; programArg 'nogui' }
    }
}
repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://cursemaven.com/' }
    maven { url = 'https://maven.caffeinemc.net/releases' }
    mavenCentral()
}
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'net.fabricmc:fabric-loader-junit:0.19.5'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    minecraft 'com.mojang:minecraft:26.2'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation "net.fabricmc.fabric-api:fabric-api:${findProperty('sc_test_fabric_api') ?: '0.155.2+26.2'}"
    implementation 'maven.modrinth:forge-config-api-port:rSd3GiG8'
    compileOnly 'mezz.jei:jei-26.2-fabric:30.13.0.79'
    compileOnly 'maven.modrinth:jade:26.2.11+fabric'
    compileOnly 'curse.maven:ftb-library-forge-404465:7971743'
    compileOnly 'curse.maven:ftb-teams-forge-404468:7972096'
    compileOnly 'curse.maven:betterf3-401648:8398082'
    compileOnly 'curse.maven:wthit-forge-455982:8512439'
    compileOnly 'curse.maven:badpackets-615134:7878544'
    compileOnly 'curse.maven:projecte-226410:3955047'
    compileOnly 'curse.maven:embeddium-908741:6116910'
    compileOnly 'maven.modrinth:sodium:mc26.2-0.9.1-fabric'
    compileOnly 'curse.maven:distant-horizons-508933:8389161'
    compileOnly 'curse.maven:curios-309927:8478313'
}
sourceSets.main {
    resources.setSrcDirs(['src/generated/resources', 'src/main/resources'])
    java.exclude 'net/geforcemods/securitycraft/datagen/**'
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
    exclude 'META-INF/neoforge.mods.toml', 'META-INF/accesstransformer.cfg', 'META-INF/enum_extensions.json', '.cache/**'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '10000']
}
jar {
    from('LICENSE') { rename { 'LICENSE_securitycraft' } }
}

test { useJUnitPlatform() }

tasks.named('sourcesJar') { duplicatesStrategy = DuplicatesStrategy.EXCLUDE }

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'securitycraft_port_tests'
        enableGameTests = true
        enableClientGameTests = true
        eula = true
    }
}
